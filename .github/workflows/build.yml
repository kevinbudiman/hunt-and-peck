name: Build

on:
  push:
    branches: [master]
    tags: ['release/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # create releases on release/* tags
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Build
        run: dotnet build HuntAndPeck.slnx -c Release

      - name: Test
        run: dotnet test --solution HuntAndPeck.slnx -c Release --no-build --output detailed

      - name: Publish
        run: |
          # release/1.8 -> 1.8; untagged builds keep the default version
          $version = if ($env:GITHUB_REF -like 'refs/tags/release/*') { $env:GITHUB_REF_NAME -replace '^release/', '' } else { '1.0.0' }
          dotnet publish HuntAndPeck/HuntAndPeck.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: HuntAndPeck-win-x64
          path: dist/hap.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/release/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^release/', ''
          gh release create $env:GITHUB_REF_NAME dist/hap.exe --title "HuntAndPeck $version" --generate-notes
