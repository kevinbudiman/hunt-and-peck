name: Build

on:
  push:
    branches: [master]
    tags: ['release/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Build
        run: dotnet build HuntAndPeck.slnx -c Release

      - name: Test
        run: dotnet test --solution HuntAndPeck.slnx -c Release --no-build

      - name: Publish
        run: dotnet publish HuntAndPeck/HuntAndPeck.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: HuntAndPeck-win-x64
          path: dist/hap.exe
